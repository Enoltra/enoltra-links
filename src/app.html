<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<!-- =====================================================
     CONSENT MODE V2 — must run BEFORE any tracking tags
===================================================== -->
<script>
window.dataLayer = window.dataLayer || [];
function gtag() { dataLayer.push(arguments); }
gtag('consent', 'default', {
ad_storage: 'denied',
ad_user_data: 'denied',
ad_personalization: 'denied',
analytics_storage: 'denied',
wait_for_update: 500
});
window._fbConsentGranted = false;
</script>

<script>
!function(f,b,e,v,n,t,s)
{if(f.fbq)return;n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];
s.parentNode.insertBefore(t,s)}(window, document,'script',
'https://connect.facebook.net/en_US/fbevents.js');

// ---------------------------------------------------------------
// Consent hooks.
// NOTE: the Silktide consent manager does NOT dispatch a DOM event.
// It only pushes to window.dataLayer (for GTM). The supported hook is
// the per-consent-type onAccept / onReject callbacks passed to init(),
// which also re-run automatically for returning visitors.
// These globals are called from those callbacks further down.
// ---------------------------------------------------------------
window._grantMarketingConsent = function () {
try {
fbq('consent', 'grant');
window._fbConsentGranted = true;
gtag('consent', 'update', {
ad_storage: 'granted',
ad_user_data: 'granted',
ad_personalization: 'granted'
});
if (!window._fbPageViewFired) {
fbq('track', 'PageView');
window._fbPageViewFired = true;
}
if (window._fbQueue && window._fbQueue.length) {
window._fbQueue.forEach(function (item) {
try { fbq('trackCustom', item.name, item.params); } catch (e) {}
});
window._fbQueue = [];
}
} catch (e) {}
};

window._revokeMarketingConsent = function () {
try {
fbq('consent', 'revoke');
window._fbConsentGranted = false;
} catch (e) {}
};

fbq('consent', 'revoke');
fbq('init', '908360642829623');
window._fbPageViewFired = false;
</script>
<noscript>
<img height="1" width="1" style="display:none"
src="https://www.facebook.com/tr?id=908360642829623&ev=PageView&noscript=1"/>
</noscript>

<!-- =====================================================
     SILKTIDE CONSENT MANAGER
===================================================== -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" id="silktide-consent-manager-css"
href="https://cdn.jsdelivr.net/gh/silktide/consent-manager@v2.0.1/silktide-consent-manager.css"
integrity="sha384-EdMq+R+YOnsbelo08wPenoTlnxbAyxI11NMIxzugx/qAsbh64KcOkqxYqq6pfvO/"
crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/gh/silktide/consent-manager@v2.0.1/silktide-consent-manager.js"
integrity="sha384-5Pt34uiIbCsvfiiZXoLi4HRf/YBXjr9c8e+gYeVo9smUaInNHYVtc8NZ8wUnXJIq"
crossorigin="anonymous"></script>

<style>
#stcm-wrapper {
--fontFamily: 'Darker Grotesque', sans-serif;
--primaryColor: #C1FF72;
--backgroundColor: #A374F5;
--textColor: #FFFFFF;
--boxShadow: none;
--backdropBackgroundColor: transparent;
--backdropBackgroundBlur: 0;
--iconColor: #A374F5;
--iconBackgroundColor: #C1FF72;
}

/* ── Slim, full-width bottom notification strip ── */
#stcm-wrapper,
#stcm-wrapper .stcm-banner,
#stcm-wrapper [class*="banner"] {
width: 100% !important;
max-width: 100% !important;
box-sizing: border-box !important;
}

#stcm-wrapper .stcm-prompt,
#stcm-wrapper [class*="prompt"] {
width: 100% !important;
max-width: 100% !important;
box-sizing: border-box !important;
padding: 10px 48px 10px 16px !important;
margin: 0 !important;
min-height: 0 !important;
}

/* ── Small, centred banner copy ── */
#stcm-wrapper .stcm-prompt p,
#stcm-wrapper [class*="prompt"] p {
font-family: 'Darker Grotesque', sans-serif !important;
font-size: 0.9rem !important;
font-weight: 600 !important;
line-height: 1.25 !important;
text-align: center !important;
margin: 0 !important;
}

/* ── Keep actions compact and inline ── */
#stcm-wrapper .stcm-prompt__actions,
#stcm-wrapper [class*="prompt"] [class*="actions"] {
display: inline !important;
margin: 0 !important;
padding: 0 !important;
}

/* ── All prompt actions appear as small underlined text ── */
#stcm-wrapper button:not([class*="close"]):not([aria-label="Close"]):not([aria-label="close"]),
#stcm-wrapper .stcm-button {
display: inline !important;
font-family: 'Darker Grotesque', sans-serif !important;
font-size: 0.9rem !important;
font-weight: 800 !important;
line-height: 1.25 !important;
color: #FFFFFF !important;
background: transparent !important;
background-color: transparent !important;
border: 0 !important;
border-radius: 0 !important;
padding: 0 !important;
margin: 0 0 0 4px !important;
box-shadow: none !important;
text-decoration: underline !important;
text-decoration-thickness: 1px !important;
text-underline-offset: 3px !important;
cursor: pointer !important;
white-space: nowrap !important;
}

/* Prevent green/outlined Accept All pill styles. */
#stcm-wrapper .stcm-button--accept-all,
#stcm-wrapper button.stcm-button--accept-all {
color: #FFFFFF !important;
background: transparent !important;
background-color: transparent !important;
border: 0 !important;
}

/* ── Small standalone close button ── */
#stcm-wrapper .stcm-close,
#stcm-wrapper .stcm-button--close,
#stcm-wrapper button.stcm-close,
#stcm-wrapper button[class*="close"],
#stcm-wrapper button[aria-label="Close"],
#stcm-wrapper button[aria-label="close"] {
all: unset !important;
position: absolute !important;
top: 50% !important;
right: 14px !important;
transform: translateY(-50%) !important;
display: inline-flex !important;
align-items: center !important;
justify-content: center !important;
width: 26px !important;
height: 26px !important;
cursor: pointer !important;
color: #FFFFFF !important;
opacity: 0.8 !important;
background: transparent !important;
border: none !important;
padding: 0 !important;
box-shadow: none !important;
transition: opacity 0.2s !important;
}

#stcm-wrapper .stcm-close:hover,
#stcm-wrapper .stcm-button--close:hover,
#stcm-wrapper button.stcm-close:hover,
#stcm-wrapper button[class*="close"]:hover,
#stcm-wrapper button[aria-label="Close"]:hover,
#stcm-wrapper button[aria-label="close"]:hover {
opacity: 1 !important;
background: transparent !important;
}

/* ── Hide Silktide branding ── */
#stcm-wrapper .stcm-preferences-link,
#stcm-wrapper .stcm-credit-link,
#stcm-wrapper .stcm-icon,
#stcm-wrapper [class*="stcm-icon"],
#stcm-wrapper [class*="silktide"],
#stcm-wrapper .stcm-prompt__icon,
#stcm-wrapper .stcm-banner__icon,
#stcm-wrapper [class*="__icon"],
#stcm-wrapper img[src*="silktide"],
#stcm-wrapper svg[class*="icon"],
#stcm-icon,
.stcm-icon {
display: none !important;
}

a[href*="silktide"] {
display: none !important;
visibility: hidden !important;
opacity: 0 !important;
pointer-events: none !important;
width: 0 !important;
height: 0 !important;
overflow: hidden !important;
}

/* ── Keep the preferences modal readable ── */
#stcm-wrapper h1,
#stcm-wrapper h2,
#stcm-wrapper h3 {
font-family: 'Dela Gothic One', sans-serif;
font-weight: 400;
text-transform: none;
}
</style>

<script>
(function () {
function removeSilktideBranding() {
document.querySelectorAll('a[href*="silktide"]').forEach(function (el) {
var root = el.closest('[id*="stcm"], [class*="stcm"], [id*="silktide"], [class*="silktide"]');
(root || el).remove();
});
document.querySelectorAll(
'#stcm-icon, [class*="stcm-icon"], [id*="stcm-icon"], ' +
'[class*="stcm-prompt__icon"], [class*="stcm-banner__icon"], ' +
'[class*="__icon"][id*="stcm"], ' +
'img[src*="silktide"], svg[class*="icon"]'
).forEach(function (el) { el.remove(); });
}

function stylePromptActions() {
var wrapper = document.querySelector('#stcm-wrapper');
if (!wrapper) return;

wrapper.querySelectorAll('button, a').forEach(function (el) {
var label = (el.textContent || '').trim().toLowerCase();

if (
label === 'accept all' ||
label === 'no thanks' ||
label === 'reject non-essential' ||
label === 'preferences'
) {
var s = el.style;
s.setProperty('display', 'inline', 'important');
s.setProperty('font-family', '"Darker Grotesque", sans-serif', 'important');
s.setProperty('font-size', '0.9rem', 'important');
s.setProperty('font-weight', '800', 'important');
s.setProperty('color', '#FFFFFF', 'important');
s.setProperty('text-decoration', 'underline', 'important');
s.setProperty('text-underline-offset', '3px', 'important');
s.setProperty('text-decoration-thickness', '1px', 'important');
s.setProperty('background', 'transparent', 'important');
s.setProperty('border', '0', 'important');
s.setProperty('border-radius', '0', 'important');
s.setProperty('padding', '0', 'important');
s.setProperty('margin', '0 0 0 4px', 'important');
s.setProperty('box-shadow', 'none', 'important');
s.setProperty('width', 'auto', 'important');
s.setProperty('height', 'auto', 'important');
}
});
}

document.addEventListener('DOMContentLoaded', function () {
removeSilktideBranding();
stylePromptActions();

var observer = new MutationObserver(function () {
removeSilktideBranding();
stylePromptActions();
});

observer.observe(document.body, { childList: true, subtree: true });
setTimeout(function () { observer.disconnect(); }, 15000);
});
})();
</script>

<script>
window.silktideConsentManager.init({
prompt: { position: 'bottomCenter' },
icon: { position: 'bottomLeft', show: false },
backdrop: { show: false },
text: {
prompt: {
description: '<p>I use cookies to improve the site for visitors — please accept if that\'s ok 😊</p>',
acceptAllButtonText: 'Accept all',
rejectNonEssentialButtonText: 'No thanks',
preferencesButtonText: 'Preferences'
},
preferences: {
title: 'Choose what works for you',
description: '<p>I like to keep this simple. Essential cookies keep the site working properly, analytics help me understand what people are into, and marketing cookies support advertising and audience insights. Pick whatever feels right for you.</p>',
saveButtonText: 'Save settings',
creditLinkText: ''
}
},
consentTypes: [
{
id: 'essential',
label: 'Essential',
description: '<p>Needed for the site to work properly and securely.</p>',
required: true
},
{
id: 'analytics',
label: 'Analytics',
description: '<p>Helps me understand visits, pages, and what content gets the most interest.</p>',
defaultValue: false,
gtag: 'analytics_storage',
onAccept: function () {
try { gtag('consent', 'update', { analytics_storage: 'granted' }); } catch (e) {}
},
onReject: function () {
try { gtag('consent', 'update', { analytics_storage: 'denied' }); } catch (e) {}
}
},
{
id: 'advertising',
label: 'Marketing',
description: '<p>Used for marketing and advertising purposes, including measuring campaigns and reaching people who may be interested in my work.</p>',
defaultValue: false,
gtag: ['ad_storage', 'ad_user_data', 'ad_personalization'],
onAccept: function () { window._grantMarketingConsent(); },
onReject: function () { window._revokeMarketingConsent(); }
}
]
});

document.addEventListener('DOMContentLoaded', function () {
if (window._fbConsentGranted) return;

try {
var stored = localStorage.getItem('stcm.consent.advertising');
if (stored === null) {
stored = localStorage.getItem('silktideCookieChoice_advertising');
}
if (stored === 'true') {
window._grantMarketingConsent();
}
} catch (e) {}
});
</script>

%sveltekit.head%
</head>
<body data-sveltekit-preload-data="hover">
<div style="display: contents">%sveltekit.body%</div>
</body>
</html>
